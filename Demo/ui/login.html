<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        :root {
            color-scheme: dark;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background:
                radial-gradient(circle at top, rgba(37, 99, 235, 0.18), transparent 30%),
                linear-gradient(180deg, #020617 0%, #0b1220 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: Arial, sans-serif;
            color: white;
            padding: 20px;
        }

        .auth-card {
            width: min(360px, 100%);
            background: #111a2e;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .auth-card h2 {
            margin: 0 0 8px;
            text-align: center;
        }

        .subtext {
            margin: 0 0 20px;
            text-align: center;
            color: #9ca3af;
            line-height: 1.5;
            font-size: 14px;
        }

        .flash-list {
            display: grid;
            gap: 10px;
            margin-bottom: 16px;
        }

        .flash {
            border-radius: 12px;
            padding: 12px 14px;
            font-size: 14px;
            line-height: 1.45;
        }

        .flash.error {
            background: rgba(248, 113, 113, 0.14);
            color: #fecaca;
        }

        .flash.success {
            background: rgba(34, 197, 94, 0.12);
            color: #bbf7d0;
        }

        .auth-card input {
            width: 100%;
            padding: 12px;
            margin-bottom: 14px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            outline: none;
            background: rgba(255, 255, 255, 0.04);
            color: white;
            box-sizing: border-box;
        }

        .auth-card button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: 700;
            transition: 0.2s ease;
        }

        .primary-btn {
            background: #2563eb;
            color: white;
            margin-top: 4px;
        }

        .primary-btn:hover {
            background: #1d4ed8;
        }

        .secondary-btn {
            margin-top: 12px;
            background: rgba(255, 255, 255, 0.05);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .secondary-btn:hover {
            background: rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body>
    <form class="auth-card" method="POST" action="/login">
        <h2>Login</h2>
        <p class="subtext">Sign in to access your traffic camera dashboard, favorites, and browsing history.</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                <div class="flash-list">
                    {% for category, message in messages %}
                        <div class="flash {{ 'success' if category == 'success' else 'error' }}">{{ message }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        <input type="text" name="username" placeholder="Username" autocomplete="username" value="{{ username|default('', true) }}" required>
        <input type="password" name="password" placeholder="Password" autocomplete="current-password" required>

        <button type="submit" class="primary-btn">Login</button>
        <button type="button" class="secondary-btn" onclick="window.location.href='/registerPage.html'">Create an account</button>
    </form>
</body>
</html>
